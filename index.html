<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DDO contact check</title>
<style>
:root{--navy:#231971;--ink:#2a2742;--lilac:#d7d2f9;--row:#f6f4fc;--miss:#8a3b12}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:#fff;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:16px}header h1{margin:0 0 4px;font-size:18px}header p{margin:0;font-size:13px;opacity:.9}
.wrap{padding:16px;max-width:640px;margin:0 auto}label{display:block;font-weight:700;color:var(--navy);margin-bottom:8px}
#q{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--navy);border-radius:10px;outline:none}
.hint{font-size:13px;color:#555;margin:8px 0 12px}
#list{border:1px solid #e4e0f4;border-radius:10px;overflow:hidden;display:none;background:#fff}
.item{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px}
.item b{color:var(--navy);display:block}.item span{font-size:12px;color:#555}
#card{display:none;margin-top:16px;background:var(--row);border-radius:12px;padding:16px}
#card h2{margin:0 0 6px;color:var(--navy);font-size:18px}.k{color:#666;font-size:12px}.v{font-weight:700;color:var(--navy);font-size:17px;word-break:break-all}.miss{color:var(--miss)}
footer{padding:8px 16px 24px;font-size:12px;color:#777;max-width:640px;margin:0 auto}#st{font-size:13px;color:#555}
</style></head><body>
<header><h1>Check DDO mobile and email</h1><p>Ananthapuramu and Sri Sathya Sai · PAG (A&E) GPF Adalat</p></header>
<div class="wrap">
<p id="st">Loading DDO list...</p>
<label for="q">Search DDO code or office name</label>
<input id="q" type="search" autocomplete="off" placeholder="Type part of DDO code or name" disabled>
<p class="hint">Type 2 or more letters. A list will drop down. Tap a name to see mobile and email.</p>
<div id="list"></div><div id="card"></div>
</div>
<footer>For Adalat use. If mobile or email is missing, furnish official contact to AG office.</footer>
<script>
const FILES=["e0.json","e1.json","e2.json","e3.json","e4.json","e5.json","e6.json","e7.json","e8.json","e9.json","e10.json","e11.json","e12.json","e13.json","e14.json","e15.json"];
let DATA=[];
const q=document.getElementById("q"),list=document.getElementById("list"),card=document.getElementById("card"),st=document.getElementById("st");
function norm(s){return (s||"").toString().toLowerCase().replace(/\s+/g,"")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":"""}[c]||"&#39;"))}
function search(term){const t=norm(term);if(t.length<2)return[];const out=[];for(const r of DATA){if(norm(r.i).includes(t)||norm(r.n).includes(t)){out.push(r);if(out.length>=12)break}}return out}
function showList(rows){if(!rows.length){list.style.display="none";list.innerHTML="";return}list.innerHTML=rows.map(r=>`<button type="button" class="item"><b>${esc(r.n||r.i)}</b><span>${esc(r.i)} · ${esc(r.d)}</span></button>`).join("");list.style.display="block";list.querySelectorAll(".item").forEach((btn,i)=>{btn.onclick=()=>pick(rows[i])})}
function pick(r){q.value=r.n||r.i;list.style.display="none";const mob=r.m?esc(r.m):'<span class="miss">Not available</span>';const em=r.e?esc(r.e):'<span class="miss">Not available</span>';card.style.display="block";card.innerHTML=`<h2>${esc(r.n||r.i)}</h2><div class="k">District</div><div class="v">${esc(r.d)}</div><div class="k">DDO code</div><div class="v">${esc(r.i)}</div><div class="k">Mobile</div><div class="v">${mob}</div><div class="k">Email</div><div class="v">${em}</div>`}
q.addEventListener("input",()=>{card.style.display="none";showList(search(q.value))});
Promise.all(FILES.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()}))).then(parts=>{DATA=parts.flat();st.textContent=DATA.length+" DDOs loaded. Type to search.";q.disabled=false;q.focus()}).catch(()=>{st.textContent="Could not load DDO list. Check network."});
</script></body></html>
