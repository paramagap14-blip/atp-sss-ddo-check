<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DDO contact check</title>
<style>
:root{--navy:#231971;--ink:#2a2742;--row:#f6f4fc;--miss:#8a3b12}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:#fff;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:16px}header h1{margin:0 0 4px;font-size:18px}header p{margin:0;font-size:13px;opacity:.9}
.wrap{padding:16px;max-width:640px;margin:0 auto}label{display:block;font-weight:700;color:var(--navy);margin-bottom:8px}
#q{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--navy);border-radius:10px}
.hint{font-size:13px;color:#555;margin:8px 0 12px}
#list{border:1px solid #e4e0f4;border-radius:10px;overflow:hidden;display:none}
.item{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;border-bottom:1px solid #eee;font-size:14px}
.item b{color:var(--navy);display:block}.item span{font-size:12px;color:#555}
#card{display:none;margin-top:16px;background:var(--row);border-radius:12px;padding:16px}
#card h2{margin:0 0 6px;color:var(--navy);font-size:18px}.k{color:#666;font-size:12px}.v{font-weight:700;color:var(--navy);font-size:17px;word-break:break-all}.miss{color:var(--miss)}
footer{padding:8px 16px 24px;font-size:12px;color:#777}#st{font-size:13px;color:#555}
</style></head><body>
<header><h1>Check DDO mobile and email</h1><p>Ananthapuramu and Sri Sathya Sai</p></header>
<div class="wrap">
<p id="st">Loading DDO list...</p>
<label for="q">Search DDO code or office name</label>
<input id="q" type="search" autocomplete="off" placeholder="Type part of DDO code or name" disabled>
<p class="hint">Type 2 or more letters. Dropdown will show. Tap to see mobile and email.</p>
<div id="list"></div><div id="card"></div>
</div>
<footer>If mobile or email is missing, furnish official contact to AG office.</footer>
<script>
const FILES=["e0.json","e1.json","e2.json","e15.json"];
let DATA=[];
const q=document.getElementById("q");
const list=document.getElementById("list");
const card=document.getElementById("card");
const st=document.getElementById("st");
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"")}
function esc(s){return String(s||"").replace(/&/g,"and").replace(/</g,"")}
function search(term){const t=norm(term);if(t.length<2)return[];const out=[];for(const r of DATA){if(norm(r.i).includes(t)||norm(r.n).includes(t)){out.push(r);if(out.length>=12)break}}return out}
function showList(rows){if(!rows.length){list.style.display="none";list.innerHTML="";return}list.innerHTML=rows.map(r=>"<button type=button class=item><b>"+esc(r.n||r.i)+"</b><span>"+esc(r.i)+" | "+esc(r.d)+"</span></button>").join("");list.style.display="block";list.querySelectorAll(".item").forEach((btn,i)=>{btn.onclick=function(){pick(rows[i])}})}
function pick(r){q.value=r.n||r.i;list.style.display="none";card.style.display="block";card.innerHTML="<h2>"+esc(r.n||r.i)+"</h2><div class=k>District</div><div class=v>"+esc(r.d)+"</div><div class=k>DDO code</div><div class=v>"+esc(r.i)+"</div><div class=k>Mobile</div><div class=v>"+(r.m?esc(r.m):"<span class=miss>Not available</span>")+"</div><div class=k>Email</div><div class=v>"+(r.e?esc(r.e):"<span class=miss>Not available</span>")+"</div>"}
q.addEventListener("input",function(){card.style.display="none";showList(search(q.value))});
function loadOne(f){return new Promise(function(resolve){var done=false;var t=setTimeout(function(){if(!done){done=true;resolve([])}},4000);fetch(f).then(function(r){return r.ok?r.json():[]}).then(function(j){if(!done){done=true;clearTimeout(t);resolve(j||[])}}).catch(function(){if(!done){done=true;clearTimeout(t);resolve([])}})})}
(async function(){for(var i=0;i<FILES.length;i++){var part=await loadOne(FILES[i]);if(part&&part.length){DATA=DATA.concat(part);st.textContent=DATA.length+" DDOs loaded. You can type now.";q.disabled=false;if(i===0)q.focus()}}if(!DATA.length)st.textContent="Could not load DDO list. Use the hall laptop.";else st.textContent=DATA.length+" DDOs loaded. Type to search.";})();
</script></body></html>
