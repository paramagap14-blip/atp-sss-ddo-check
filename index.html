<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPF ADALATH</title>
<style>
:root{--navy:#231971;--ink:#2a2742;--row:#f6f4fc;--miss:#8a3b12;--line:#c9c4e6}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:#fff;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:.08em}
header p{margin:6px 0 0;font-size:13px;opacity:.95}
.wrap{padding:16px;max-width:640px;margin:0 auto}
label{display:block;font-weight:700;color:var(--navy);margin:10px 0 6px;font-size:14px}
input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--navy);border-radius:8px}
input[readonly]{background:#f3f3f8}
.hint{font-size:13px;color:#555;margin:6px 0 10px}
#list{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;margin-bottom:12px}
.item{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px;border-bottom:1px solid #eee;font-size:14px}
.item b{color:var(--navy);display:block}.item span{font-size:12px;color:#555}
.box{background:var(--row);border-radius:12px;padding:14px;margin-top:8px}
.db{font-size:15px;font-weight:700;color:var(--navy);word-break:break-all}.nodata{color:var(--miss);font-weight:700}
a.primary{display:block;text-align:center;text-decoration:none;margin-top:10px;background:var(--navy);color:#fff;border-radius:8px;padding:12px;font-size:15px;font-weight:700}
.signgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.signbox{border:1px dashed var(--navy);min-height:90px;border-radius:8px;padding:8px;font-size:12px;color:#555}
#st{font-size:13px;color:#555}#panel{display:none}
</style></head><body>
<header><h1>GPF ADALATH</h1><p>Ananthapuramu and Sri Sathya Sai</p></header>
<div class="wrap">
<p id="st">Search your DDO. Staple self-attested xerox of office ID with the printed form.</p>
<label for="q">Search DDO code or office name</label>
<input id="q" type="search" autocomplete="off" placeholder="Type part of DDO code or office name">
<p class="hint">Type 2 or more letters. Tap a record to see database details.</p>
<div id="list"></div>
<div id="panel" class="box">
<label>DDO code (TRY ID)</label><input id="ddo_id" readonly>
<label>Office name</label><input id="office" readonly>
<label>District</label><input id="district" readonly>
<label>Mobile in database</label><div class="db" id="db_mobile"></div>
<label>Email in database</label><div class="db" id="db_email"></div>
<label for="mobile">Mobile number (you may change)</label><input id="mobile" inputmode="numeric" maxlength="15">
<label for="email">Email (you may change)</label><input id="email" type="email">
<label for="officer">DDO name / officer name (block letters)</label>
<input id="officer" placeholder="OFFICER NAME IN BLOCK LETTERS">
<label for="id_no">Office identity card number</label>
<input id="id_no" placeholder="Enter office ID card number">
<a class="primary" id="dl_edit" href="form.html">Download edited form</a>
<a class="primary" id="dl_blank" href="form.html">Download blank mobile and email form</a>
</div>
<div class="signgrid"><div><div>Sign</div><div class="signbox">Signature</div></div><div><div>Clear stamp</div><div class="signbox">Office stamp</div></div></div>
</div>
<script>
const SUPABASE_URL="https://rgmcfonosdomcfsunoxw.supabase.co";
const SUPABASE_ANON="sb_publishable__5_dRlB4XjY2f3yq_MWEjA_rAZYgRJR";
const HDR={apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON};
const q=document.getElementById("q"),list=document.getElementById("list"),st=document.getElementById("st");
let timer=null;
function esc(s){return String(s||"").replace(/&/g,"and").replace(/</g,"")}
function val(id){return document.getElementById(id).value.trim()}
function showData(el,v){if(v){el.className="db";el.textContent=v}else{el.className="db nodata";el.textContent="no data is there"}}
function qs(blank){const p=new URLSearchParams({ddo_id:val("ddo_id"),office:val("office"),district:val("district"),officer:val("officer"),id_no:val("id_no")});if(!blank){p.set("mobile",val("mobile"));p.set("email",val("email"))}return "form.html?"+p.toString()}
function setDl(){document.getElementById("dl_edit").href=qs(false);document.getElementById("dl_blank").href=qs(true)}
function fill(r){document.getElementById("panel").style.display="block";document.getElementById("ddo_id").value=r.ddo_id||"";document.getElementById("office").value=r.name||"";document.getElementById("district").value=r.district||"";showData(document.getElementById("db_mobile"),r.mobile);showData(document.getElementById("db_email"),r.email);document.getElementById("mobile").value=r.mobile||"";document.getElementById("email").value=r.email||"";document.getElementById("officer").value="";document.getElementById("id_no").value="";setDl()}
function showList(rows){if(!rows.length){list.style.display="none";list.innerHTML="";return}list.innerHTML=rows.map(function(r){return "<button type=button class=item><b>"+esc(r.name||r.ddo_id)+"</b><span>"+esc(r.ddo_id)+" | "+esc(r.district)+"</span></button>"}).join("");list.style.display="block";list.querySelectorAll(".item").forEach(function(btn,i){btn.onclick=function(){fill(rows[i]);list.style.display="none";q.value=rows[i].name||rows[i].ddo_id}})}
function search(term){const t=term.trim();if(t.length<2){list.style.display="none";return}const like="*"+t.replace(/,/g,"")+"*";fetch(SUPABASE_URL+"/rest/v1/ddos?or=(name.ilike."+encodeURIComponent(like)+",ddo_id.ilike."+encodeURIComponent(like)+")&select=ddo_id,name,mobile,email,district&limit=12",{headers:HDR}).then(function(r){return r.json()}).then(function(rows){if(!Array.isArray(rows)){st.textContent="Database not ready.";return}showList(rows)}).catch(function(){st.textContent="Could not search. Use mobile data."})}
q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(function(){search(q.value)},200)});
["mobile","email","officer","id_no"].forEach(function(id){document.getElementById(id).addEventListener("input",function(){if(id==="officer"||id==="id_no")this.value=this.value.toUpperCase();setDl()})});
</script></body></html>
