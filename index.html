<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPF ADALATH</title>
<style>
:root{--navy:#231971;--ink:#2a2742;--row:#f6f4fc;--miss:#8a3b12;--line:#c9c4e6}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Segoe UI,Arial,sans-serif;background:#fff;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:.08em}
header p{margin:6px 0 0;font-size:13px;opacity:.95}
.wrap{padding:16px;max-width:640px;margin:0 auto}
label{display:block;font-weight:700;color:var(--navy);margin:10px 0 6px;font-size:14px}
input,select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--navy);border-radius:8px}
.hint{font-size:13px;color:#555;margin:6px 0 10px}
#list{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;margin-bottom:12px}
.item{display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px;border-bottom:1px solid #eee;font-size:14px}
.item b{color:var(--navy);display:block}.item span{font-size:12px;color:#555}
.box{background:var(--row);border-radius:12px;padding:14px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.primary{width:100%;margin-top:14px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:12px;font-size:16px;font-weight:700}
#msg{margin-top:10px;font-weight:700;min-height:1.2em}.ok{color:#0a7a32}.err{color:var(--miss)}
.sign{margin-top:22px;border-top:1px solid var(--navy);padding-top:14px}
.sign .name{text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:16px}
.signgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.signbox{border:1px dashed var(--navy);min-height:90px;border-radius:8px;padding:8px;font-size:12px;color:#555}
#st{font-size:13px;color:#555}
</style></head><body>
<header><h1>GPF ADALATH</h1><p>Ananthapuramu and Sri Sathya Sai - Add / update DDO contact</p></header>
<div class="wrap">
<p id="st">Search your DDO, then add or update mobile and email.</p>
<label for="q">Search DDO code or office name</label>
<input id="q" type="search" autocomplete="off" placeholder="Type part of DDO code or name">
<p class="hint">Type 2 or more letters. Tap a name to fill the form.</p>
<div id="list"></div>
<form id="f" class="box" autocomplete="off">
<label for="ddo_id">DDO code (TRY ID)</label><input id="ddo_id" required>
<label for="name">DDO / office name</label><input id="name" required>
<label for="district">District</label>
<select id="district"><option>Ananthapuramu</option><option>Sri Sathya Sai</option></select>
<div class="row2"><div><label for="mobile">Mobile number</label><input id="mobile" inputmode="numeric" maxlength="15"></div>
<div><label for="email">Email</label><input id="email" type="email"></div></div>
<button class="primary" type="submit">Save / update</button>
<p id="msg"></p>
</form>
<div class="sign">
<label for="block_name">DDO name (block letters)</label>
<input id="block_name" class="name" placeholder="NAME IN BLOCK LETTERS">
<div class="signgrid">
<div><div>Sign</div><div class="signbox">Signature</div></div>
<div><div>Clear stamp</div><div class="signbox">Office stamp</div></div>
</div></div></div>
<script>
const SUPABASE_URL="https://rgmcfonosdomcfsunoxw.supabase.co";
const SUPABASE_ANON="sb_publishable__5_dRlB4XjY2f3yq_MWEjA_rAZYgRJR";
const HDR={apikey:SUPABASE_ANON,Authorization:"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"};
const q=document.getElementById("q"),list=document.getElementById("list"),msg=document.getElementById("msg"),st=document.getElementById("st");
let timer=null;
function esc(s){return String(s||"").replace(/&/g,"and").replace(/</g,"")}
function val(id){return document.getElementById(id).value.trim()}
function fill(r){document.getElementById("ddo_id").value=r.ddo_id||"";document.getElementById("name").value=r.name||"";document.getElementById("mobile").value=r.mobile||"";document.getElementById("email").value=r.email||"";document.getElementById("district").value=r.district==="Sri Sathya Sai"?"Sri Sathya Sai":"Ananthapuramu";document.getElementById("block_name").value=(r.name||"").toUpperCase()}
function showList(rows){if(!rows.length){list.style.display="none";list.innerHTML="";return}list.innerHTML=rows.map(function(r){return "<button type=button class=item><b>"+esc(r.name||r.ddo_id)+"</b><span>"+esc(r.ddo_id)+" | "+esc(r.district)+"</span></button>"}).join("");list.style.display="block";list.querySelectorAll(".item").forEach(function(btn,i){btn.onclick=function(){fill(rows[i]);list.style.display="none";q.value=rows[i].name||rows[i].ddo_id}})}
function search(term){const t=term.trim();if(t.length<2){list.style.display="none";return}const like="*"+t.replace(/,/g,"")+"*";fetch(SUPABASE_URL+"/rest/v1/ddos?or=(name.ilike."+encodeURIComponent(like)+",ddo_id.ilike."+encodeURIComponent(like)+")&select=ddo_id,name,mobile,email,district&limit=12",{headers:HDR}).then(function(r){return r.json()}).then(function(rows){if(!Array.isArray(rows)){st.textContent="Database not ready. Run SQL in Supabase.";return}showList(rows)}).catch(function(){st.textContent="Could not search. Use mobile data."})}
q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(function(){search(q.value)},200)});
document.getElementById("name").addEventListener("input",function(){document.getElementById("block_name").value=this.value.toUpperCase()});
document.getElementById("f").addEventListener("submit",function(ev){ev.preventDefault();msg.className="";msg.textContent="Saving...";const row={ddo_id:val("ddo_id"),name:val("name"),mobile:val("mobile"),email:val("email"),district:val("district")};if(!row.ddo_id||!row.name){msg.className="err";msg.textContent="DDO code and name are required.";return}fetch(SUPABASE_URL+"/rest/v1/ddos?on_conflict=ddo_id",{method:"POST",headers:Object.assign({},HDR,{Prefer:"resolution=merge-duplicates,return=representation"}),body:JSON.stringify(row)}).then(function(r){return r.json().then(function(j){return {ok:r.ok}})}).then(function(res){if(!res.ok){msg.className="err";msg.textContent="Save failed. Run the SQL in Supabase.";return}msg.className="ok";msg.textContent="Saved. Mobile and email updated.";document.getElementById("block_name").value=row.name.toUpperCase()}).catch(function(){msg.className="err";msg.textContent="Save failed. Use mobile data."})});
</script></body></html>
